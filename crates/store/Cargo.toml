[package]
name = "store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# SQLite cache / ETags / CI baselines / config + keychain wrapper (ARD AD-6). `rusqlite` backs the
# non-secret config (bundled SQLite = zero system dependency); the GitHub PAT lives ONLY in the OS
# keychain via `keyring`, never in SQLite/config/logs.
[dependencies]
domain = { path = "../domain" }
rusqlite = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

# The GitHub PAT lives ONLY in the OS keychain via `keyring` (never in SQLite/config/logs). The
# backend is target-selected here so no call site branches on OS — `keychain.rs` uses keyring's
# uniform, synchronous `Entry` API against whichever backend is compiled in.

# Linux: Secret Service over the pure-Rust `zbus` D-Bus stack (not the C `libdbus`) — the
# `async-secret-service` store driven by the already-present `async-io` executor, with pure-Rust
# crypto. This keeps the binary free of any C/copyleft-dual D-Bus linkage; the async backend is
# blocked on internally so the `Entry` API stays synchronous. Features are additive; the workspace
# pins the keyring v3 line.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "async-io", "crypto-rust"] }

# macOS: the login Keychain via the Security framework (`apple-native`), a synchronous native
# backend needing no D-Bus/crypto features.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[lints]
workspace = true
