# Publish a release when a release-labelled PR is merged (or on manual dispatch).
#
# The version is NOT stored in the repo. The `version` job derives the next version from the latest
# published GitHub Release and the requested bump (a PR label, or the workflow_dispatch input), then
# `macos` + `release` consume it via job outputs and stamp it into Cargo.toml at build time. This
# removes the old committed VERSION file and its version-bump race entirely (ALRT-27): there is no
# bump commit to lose, and a collision guard refuses to re-publish an existing version.
#
# Nothing here pushes to `main`, so it is fully compatible with branch protection.
name: release

on:
  pull_request:
    types: [closed]
  # Manual release: choose the bump relative to the latest published release.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump relative to the latest published release"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # create the release + tag
  id-token: write # OIDC token for provenance attestation
  attestations: write # write the attestation

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Single source of truth for the version. Latest release tag + requested bump → next version. The
  # trigger guard lives here; `macos`/`release` inherit it through `needs` (they skip if this skips).
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && (
      contains(github.event.pull_request.labels.*.name, 'release') ||
      contains(github.event.pull_request.labels.*.name, 'release:major') ||
      contains(github.event.pull_request.labels.*.name, 'release:patch')))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Compute next version from the latest release
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          DISPATCH_BUMP: ${{ inputs.bump }}
          IS_MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}
          IS_PATCH: ${{ contains(github.event.pull_request.labels.*.name, 'release:patch') }}
        run: |
          set -euo pipefail
          # Base = the latest published release (vX.Y.Z). No releases yet → start from 0.0.0.
          latest="$(gh release view -R "$REPO" --json tagName --jq .tagName 2>/dev/null || true)"
          base="${latest#v}"; base="${base:-0.0.0}"
          IFS=. read -r MAJ MIN PAT <<< "$base"

          if [ "$IS_DISPATCH" = "true" ]; then
            bump="${DISPATCH_BUMP:-patch}"
          elif [ "$IS_MAJOR" = "true" ]; then
            bump="major"
          elif [ "$IS_PATCH" = "true" ]; then
            bump="patch"
          else
            bump="minor" # the plain `release` label
          fi

          case "$bump" in
            major) next="$((MAJ + 1)).0.0" ;;
            patch) next="${MAJ}.${MIN}.$((PAT + 1))" ;;
            *)     next="${MAJ}.$((MIN + 1)).0" ;;
          esac

          # Never overwrite an existing release (guards against a stale/duplicate trigger).
          if gh release view -R "$REPO" "v$next" >/dev/null 2>&1; then
            echo "::error::v$next already exists — refusing to re-publish (base v$base, bump $bump)."
            exit 1
          fi

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Base v$base + $bump → v$next"

  # Build the unsigned universal (x86_64 + arm64) .dmg on macOS and hand it to `release` as an
  # artifact. Same checkout ref as `release` so both package the exact same commit.
  macos:
    needs: version
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Stamp the computed version into Cargo.toml
        run: |
          sed -i.bak "0,/^version = / s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # macos-14 is Apple Silicon; add the Intel target so we can lipo a universal binary.
      - name: Add x86_64 Apple target
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --target x86_64-apple-darwin -p app --bin alurtmee
          cargo build --release --target aarch64-apple-darwin -p app --bin alurtmee
          mkdir -p dist-bin
          lipo -create -output dist-bin/alurtmee \
            target/x86_64-apple-darwin/release/alurtmee \
            target/aarch64-apple-darwin/release/alurtmee
          lipo -info dist-bin/alurtmee

      - name: Package .dmg
        run: packaging/macos/make-dmg.sh "$VERSION" dist-bin/alurtmee dist

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*.dmg

  release:
    needs: [version, macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout the merge commit
        uses: actions/checkout@v4
        with:
          # PR-merge event: the merge commit. Manual dispatch: the dispatched ref's HEAD.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Stamp the computed version into Cargo.toml
        run: |
          sed -i.bak "0,/^version = / s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Install system deps (Iced build + packaging)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev libx11-dev \
            libgl1-mesa-dev mesa-vulkan-drivers libdbus-1-dev gnome-keyring dbus-x11 file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p app --bin alurtmee

      - name: Package .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p app --no-build
          mkdir -p dist && cp target/debian/*.deb dist/

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OUTPUT: "Alurtmee-${{ env.VERSION }}-x86_64.AppImage"
        run: |
          # Seed the AppDir with the AppStream metainfo so the AppImage carries publisher/
          # license metadata too; linuxdeploy preserves existing AppDir contents.
          mkdir -p AppDir/usr/share/metainfo
          cp packaging/com.snoodleboot.Alurtmee.metainfo.xml AppDir/usr/share/metainfo/
          cp assets/logo-128.png com.snoodleboot.Alurtmee.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable target/release/alurtmee \
            --desktop-file packaging/com.snoodleboot.Alurtmee.desktop \
            --icon-file com.snoodleboot.Alurtmee.png \
            --output appimage
          # Move ONLY the built app image (named via $OUTPUT). A bare ./*.AppImage glob
          # would also sweep in linuxdeploy-x86_64.AppImage, the packaging tool downloaded
          # above, leaking it into the release and SHA256SUMS.
          mv "$OUTPUT" dist/

      # Pull the universal .dmg built by the `macos` job into dist/ so it joins the checksums,
      # attestation, and the published Release.
      - name: Download macOS .dmg
        uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum ./*.AppImage ./*.deb ./*.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/SHA256SUMS
          generate_release_notes: true
